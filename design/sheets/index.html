<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sheets | AsaanDesk Design</title>
<meta name="description" content="Free online spreadsheet with formulas, charts, Excel import and export, and Magic Insights. Works in your browser.">
<meta name="robots" content="noindex">
<link rel="stylesheet" href="../shared/theme.css">
<link rel="stylesheet" href="sheets.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-undo" viewBox="0 0 20 20"><path d="M7 5 3 9l4 4M3.5 9H12a5 5 0 0 1 0 10h-2"/></symbol>
  <symbol id="i-redo" viewBox="0 0 20 20"><path d="m13 5 4 4-4 4M16.5 9H8a5 5 0 0 0 0 10h2"/></symbol>
  <symbol id="i-left" viewBox="0 0 20 20"><path d="M3 5h14M3 9h9M3 13h14M3 17h9"/></symbol>
  <symbol id="i-center" viewBox="0 0 20 20"><path d="M3 5h14M5.5 9h9M3 13h14M5.5 17h9"/></symbol>
  <symbol id="i-right" viewBox="0 0 20 20"><path d="M3 5h14M8 9h9M3 13h14M8 17h9"/></symbol>
  <symbol id="i-wrap" viewBox="0 0 20 20"><path d="M3 5h14M3 10h11a3 3 0 0 1 0 6h-4m2-2-2 2 2 2M3 15h4"/></symbol>
  <symbol id="i-az" viewBox="0 0 20 20"><path d="M5 3v14m-3-3 3 3 3-3M11 4h5l-5 6h5M11 13h5m-5 4 2.5-6 2.5 6"/></symbol>
  <symbol id="i-za" viewBox="0 0 20 20"><path d="M5 17V3M2 6l3-3 3 3M11 4h5l-5 6h5M11 13h5m-5 4 2.5-6 2.5 6"/></symbol>
  <symbol id="i-filter" viewBox="0 0 20 20"><path d="M3 4h14l-5.5 6.5V16l-3 1.5v-7z"/></symbol>
  <symbol id="i-rows" viewBox="0 0 20 20"><path d="M3 3h14v14H3zM3 8h14M3 12.5h14M8 3v14"/></symbol>
  <symbol id="i-chart" viewBox="0 0 20 20"><path d="M3 17h14M5.5 14V9M10 14V5M14.5 14v-3"/></symbol>
  <symbol id="i-spark" viewBox="0 0 20 20"><path d="M10 2.5 11.8 8 17.5 10l-5.7 2-1.8 5.5L8.2 12 2.5 10l5.7-2zM16 2v3m-1.5-1.5h3"/></symbol>
  <symbol id="i-fx" viewBox="0 0 20 20"><path d="M12 3.5c-2-.6-3.4.2-3.8 2.5L6.5 15c-.4 2.2-1.7 2.9-3.5 2.4M5 8h6M12 9l5 6m0-6-5 6"/></symbol>
  <symbol id="i-find" viewBox="0 0 20 20"><path d="M8.5 3a5.5 5.5 0 1 1 0 11 5.5 5.5 0 0 1 0-11zM12.5 12.5 17 17"/></symbol>
  <symbol id="i-fill" viewBox="0 0 20 20"><path d="m4 10 6-6 6 6-6 6zM16 13.5c0 1.2 1 2.2 2 0-.4-1-1-2-1-2s-1 1-1 2z"/></symbol>
  <symbol id="i-plus" viewBox="0 0 20 20"><path d="M10 4v12M4 10h12"/></symbol>
  <symbol id="i-close" viewBox="0 0 20 20"><path d="m5 5 10 10M15 5 5 15"/></symbol>
</svg>

<header class="ad-bar top">
  <a class="ad-brand" href="/design/" title="AsaanDesk Design"><span class="ad-brand-mark" aria-hidden="true">a</span><span class="brand-text">AsaanDesk <b>Sheets</b></span></a>
  <input id="docName" class="name-input" value="Untitled sheet" aria-label="Workbook name" maxlength="80" spellcheck="false">
  <span id="saveState" class="save-state" role="status" aria-live="polite">Not saved yet</span>
  <span class="grow"></span>
  <button class="btn" id="newBtn" type="button" title="New sheet or template">New</button>
  <div class="menu-wrap">
    <button class="btn primary" id="fileBtn" type="button" aria-haspopup="menu" aria-expanded="false" aria-controls="fileMenu">File</button>
    <div class="menu" id="fileMenu" role="menu" hidden>
      <div class="menu-label">Open</div>
      <button role="menuitem" type="button" data-act="importCsv">Import CSV…</button>
      <button role="menuitem" type="button" data-act="importXlsx">Open Excel file (.xlsx)…</button>
      <button role="menuitem" type="button" data-act="openJson">Open AsaanDesk sheet file…</button>
      <div class="menu-label">Download</div>
      <button role="menuitem" type="button" data-act="exportXlsx">Excel (.xlsx)</button>
      <button role="menuitem" type="button" data-act="exportCsv">CSV (this sheet)</button>
      <button role="menuitem" type="button" data-act="exportJson">AsaanDesk sheet file (.json)</button>
      <div class="menu-label">Recent</div>
      <div id="recentList" class="recent"></div>
    </div>
  </div>
  <input id="csvInput" type="file" accept=".csv,.tsv,.txt,text/csv,text/tab-separated-values" hidden>
  <input id="xlsxInput" type="file" accept=".xlsx,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" hidden>
  <input id="jsonInput" type="file" accept=".json,application/json" hidden>
</header>

<div class="toolbar" id="toolbar" role="toolbar" aria-label="Sheet tools">
  <div class="tgroup">
    <button class="tb" id="undoBtn" type="button" title="Undo (Ctrl+Z)" aria-label="Undo" disabled><svg><use href="#i-undo"/></svg></button>
    <button class="tb" id="redoBtn" type="button" title="Redo (Ctrl+Y)" aria-label="Redo" disabled><svg><use href="#i-redo"/></svg></button>
  </div>
  <div class="tgroup">
    <select id="fmtSelect" class="tsel" aria-label="Number format" title="Number format"></select>
  </div>
  <div class="tgroup">
    <button class="tb" id="boldBtn" type="button" title="Bold (Ctrl+B)" aria-label="Bold" aria-pressed="false"><b>B</b></button>
    <button class="tb" id="italicBtn" type="button" title="Italic (Ctrl+I)" aria-label="Italic" aria-pressed="false"><i>I</i></button>
    <label class="tb color" title="Text colour"><span class="a-mark">A</span><span class="swatch" id="textSwatch"></span><input id="textColor" type="color" value="#c0392b" aria-label="Text colour"></label>
    <label class="tb color" title="Fill colour"><svg><use href="#i-fill"/></svg><span class="swatch" id="fillSwatch"></span><input id="fillColor" type="color" value="#fde68a" aria-label="Fill colour"></label>
    <button class="tb" id="clearFmtBtn" type="button" title="Clear formatting" aria-label="Clear formatting"><span class="clear-mark">T<s>x</s></span></button>
  </div>
  <div class="tgroup">
    <button class="tb" data-align="left" type="button" title="Align left" aria-label="Align left"><svg><use href="#i-left"/></svg></button>
    <button class="tb" data-align="center" type="button" title="Centre" aria-label="Centre"><svg><use href="#i-center"/></svg></button>
    <button class="tb" data-align="right" type="button" title="Align right" aria-label="Align right"><svg><use href="#i-right"/></svg></button>
    <button class="tb" id="wrapBtn" type="button" title="Wrap text" aria-label="Wrap text" aria-pressed="false"><svg><use href="#i-wrap"/></svg></button>
  </div>
  <div class="tgroup">
    <button class="tb" id="sortAsc" type="button" title="Sort A to Z by this column" aria-label="Sort A to Z"><svg><use href="#i-az"/></svg></button>
    <button class="tb" id="sortDesc" type="button" title="Sort Z to A by this column" aria-label="Sort Z to A"><svg><use href="#i-za"/></svg></button>
    <button class="tb" id="filterBtn" type="button" title="Filter rows by this column" aria-label="Filter"><svg><use href="#i-filter"/></svg></button>
    <button class="tb" id="findBtn" type="button" title="Find and replace (Ctrl+F)" aria-label="Find and replace"><svg><use href="#i-find"/></svg></button>
    <div class="menu-wrap">
      <button class="tb wide" id="rowsBtn" type="button" title="Insert or delete rows and columns" aria-haspopup="menu" aria-expanded="false" aria-controls="rowsMenu"><svg><use href="#i-rows"/></svg><span>Rows</span></button>
      <div class="menu" id="rowsMenu" role="menu" hidden>
        <button role="menuitem" type="button" data-struct="rowAbove">Insert row above</button>
        <button role="menuitem" type="button" data-struct="rowBelow">Insert row below</button>
        <button role="menuitem" type="button" data-struct="colLeft">Insert column left</button>
        <button role="menuitem" type="button" data-struct="colRight">Insert column right</button>
        <button role="menuitem" type="button" data-struct="delRow">Delete selected rows</button>
        <button role="menuitem" type="button" data-struct="delCol">Delete selected columns</button>
        <button role="menuitem" type="button" data-struct="addRows">Add 1,000 rows at the bottom</button>
      </div>
    </div>
  </div>
  <div class="tgroup">
    <button class="tb wide" id="chartBtn" type="button" title="Insert a chart from the selected cells"><svg><use href="#i-chart"/></svg><span>Chart</span></button>
    <button class="tb wide magic" id="insightsBtn" type="button" title="Magic Insights: totals, averages, trends and chart ideas for your data"><svg><use href="#i-spark"/></svg><span>Insights</span></button>
    <button class="tb wide magic" id="formulasBtn" type="button" title="Magic Formulas: find, build and explain formulas"><svg><use href="#i-fx"/></svg><span>Formulas</span></button>
  </div>
</div>

<div class="fbar">
  <input id="nameBox" class="name-box" value="A1" aria-label="Selected cell. Type a cell like B7 and press Enter to go there." spellcheck="false">
  <span class="fx" aria-hidden="true">fx</span>
  <input id="formulaInput" class="formula-input" aria-label="Contents of the selected cell" spellcheck="false" autocomplete="off">
</div>

<main class="work" id="work">
  <div class="grid" id="grid">
    <div class="corner" id="corner" title="Select all" role="button" aria-label="Select all cells"></div>
    <div class="colhead" id="colHead" aria-hidden="true"><div class="hin" id="colHeadIn"></div></div>
    <div class="rowhead" id="rowHead" aria-hidden="true"><div class="hin" id="rowHeadIn"></div></div>
    <div class="scroller" id="scroller">
      <div class="spacer" id="spacer">
        <div class="cells" id="cellLayer" role="grid" aria-label="Spreadsheet cells"></div>
        <div class="sel" id="selBox"><div class="fill-handle" id="fillHandle" title="Drag to fill"></div></div>
        <div class="active-cell" id="activeBox"></div>
        <div class="fill-preview" id="fillPreview" hidden></div>
        <div class="copy-ants" id="copyAnts" hidden></div>
        <div class="chart-layer" id="chartLayer"></div>
        <textarea id="cellInput" class="cell-input idle" aria-label="Edit cell. Type to replace, Enter to save, Escape to cancel." spellcheck="false" autocomplete="off" autocapitalize="off" wrap="off"></textarea>
        <div class="fn-hint" id="fnHint" hidden></div>
      </div>
    </div>
  </div>
  <aside class="side ad-panel" id="side" hidden aria-live="polite">
    <div class="side-head"><h2 id="sideTitle">Panel</h2><button class="tb" id="sideClose" type="button" aria-label="Close panel"><svg><use href="#i-close"/></svg></button></div>
    <div class="side-body" id="sideBody"></div>
  </aside>
</main>

<footer class="tabs-bar">
  <button class="tb" id="addSheet" type="button" title="Add a sheet" aria-label="Add a sheet"><svg><use href="#i-plus"/></svg></button>
  <div class="sheet-tabs" id="tabs" role="tablist" aria-label="Sheets"></div>
  <span class="status" id="status" aria-live="polite"></span>
</footer>

<div class="ctx-menu menu" id="ctxMenu" role="menu" hidden></div>

<dialog id="gallery" aria-labelledby="galleryTitle">
  <form method="dialog" class="gallery">
    <div class="gallery-head"><h2 id="galleryTitle">Start a new sheet</h2><button class="tb" value="cancel" aria-label="Close"><svg><use href="#i-close"/></svg></button></div>
    <div class="cards" id="galleryCards"><button type="button" class="card blank" data-template="">Blank sheet<small>Empty grid, 1,000 rows</small></button></div>
  </form>
</dialog>

<div class="ad-toast" id="toast" hidden role="status"></div>
<script type="module" src="app.js"></script>
</body>
</html>
