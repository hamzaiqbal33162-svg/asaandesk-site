<div class="fbar" id="fbar">
  <input id="nameBox" class="name-box" value="A1" aria-label="Selected cell. Type a cell like B7 and press Enter to go there." spellcheck="false">
  <span class="fx" aria-hidden="true">f(x)</span>
  <input id="formulaInput" class="formula-input" aria-label="Contents of the selected cell" spellcheck="false" autocomplete="off">
  <div class="menu-wrap">
    <button class="qc-btn" id="quickCalc" type="button" title="Quick calculations for the selected cells" aria-haspopup="menu" aria-expanded="false" aria-controls="quickMenu">Σ <span id="quickCalcText">Sum</span> ▾</button>
    <div class="menu" id="quickMenu" role="menu" hidden></div>
  </div>
</div>
<input id="cellImgInput" type="file" accept="image/*" hidden>

<div class="stage" id="stage">
<main class="work" id="work">
  <div class="grid" id="grid">
    <div class="corner" id="corner" title="Select all" role="button" aria-label="Select all cells"></div>
    <div class="colhead" id="colHead" aria-hidden="true"><div class="hin" id="colHeadIn"></div></div>
    <div class="rowhead" id="rowHead" aria-hidden="true"><div class="hin" id="rowHeadIn"></div></div>
    <div class="scroller" id="scroller">
      <div class="spacer" id="spacer">
        <div class="cells" id="cellLayer" role="grid" aria-label="Spreadsheet cells"></div>
        <div class="sel" id="selBox"><div class="fill-handle" id="fillHandle" title="Drag to fill"></div></div>
        <div class="active-cell" id="activeBox"></div>
        <div class="fill-preview" id="fillPreview" hidden></div>
        <div class="copy-ants" id="copyAnts" hidden></div>
        <div class="chart-layer" id="chartLayer"></div>
        <textarea id="cellInput" class="cell-input idle" aria-label="Edit cell. Type to replace, Enter to save, Escape to cancel." spellcheck="false" autocomplete="off" autocapitalize="off" wrap="off"></textarea>
        <div class="fn-hint" id="fnHint" hidden></div>
        <button type="button" class="dd-btn" id="ddBtn" hidden aria-label="Choose from the list" title="Choose from the list">▾</button>
        <a class="link-chip" id="linkChip" hidden target="_blank" rel="noopener noreferrer">Open link ↗</a>
        <div class="err-chip" id="errChip" role="note" hidden><b id="errCode"></b> <span id="errWhy"></span> <button type="button" id="errFix" hidden></button></div>
        <button type="button" class="dd-btn date-btn" id="dateBtn" hidden aria-label="Pick a date" title="Pick a date">📅</button>
        <input type="date" class="date-pick" id="datePick" tabindex="-1" aria-label="Date for the selected cell">
      </div>
    </div>
  </div>
  <aside class="side ad-panel" id="side" hidden aria-live="polite">
    <div class="side-head"><h2 id="sideTitle">Panel</h2><button class="tb" id="sideClose" type="button" aria-label="Close panel"><svg><use href="#i-close"/></svg></button></div>
    <div class="side-body" id="sideBody"></div>
  </aside>
</main>

<footer class="tabs-bar">
  <button class="tb" id="addSheet" type="button" title="Add a sheet" aria-label="Add a sheet"><svg><use href="#i-plus"/></svg></button>
  <div class="sheet-tabs" id="tabs" role="tablist" aria-label="Sheets"></div>
  <span class="status" id="status" aria-live="polite"></span>
</footer>
</div>

<div class="comment-pop" id="commentPop" role="dialog" aria-label="Cell comment" hidden>

  <div class="actions"><button class="btn primary" type="button" id="commentSave">Save</button><button class="btn" type="button" id="commentDel">Delete</button><button class="btn" type="button" id="commentCancel">Cancel</button></div>
</div>

    <div class="cards" id="galleryCards"><button type="button" class="card blank" data-template="">Blank sheet<small>Empty grid, 1,000 rows</small></button></div>
  </form>
</dialog>

<div class="ad-toast" id="toast" hidden role="status"></div>
