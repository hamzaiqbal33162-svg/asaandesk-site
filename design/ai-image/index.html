<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AI image generator · AsaanDesk Design</title>
<meta name="description" content="Describe a picture and AsaanDesk AI makes it: photos, watercolour, truck art, minimal, 3D, anime and pencil styles.">
<link rel="icon" href="/pdf-editor/icons/icon32.png">
<link rel="stylesheet" href="../shared/theme.css">
<link rel="stylesheet" href="ai-image.css">
<script type="module" src="app.js"></script>
</head>
<body>
<header class="ad-bar">
  <a class="ad-brand" href="/design/" aria-label="AsaanDesk Design home"><span class="ad-brand-mark">A</span><span class="brand-text">Design</span></a>
  <span class="app-name" id="appName">AI image generator</span>
</header>
<main class="wrap">
  <section class="form ad-panel" aria-labelledby="title">
    <div class="ad-tabs" id="toolTabs" role="tablist" aria-label="Generator">
      <button role="tab" data-tool="image" aria-selected="true">Image</button>
      <button role="tab" data-tool="art" aria-selected="false">Art</button>
    </div>
    <h1 id="title">AI image generator</h1>
    <p class="lead" id="lead"></p>
    <label class="lbl" for="prompt">Describe your picture <span class="count" id="promptCount">0/1000</span></label>
    <textarea id="prompt" class="ad-input" rows="4" placeholder=""></textarea>
    <div class="examples" aria-label="Examples">
      <button class="chip" data-example="A cup of chai on a wooden table by a rainy window">Chai by the window</button>
      <button class="chip" data-example="Snowy mountains above a quiet valley at sunrise">Mountain sunrise</button>
      <button class="chip" data-example="A colourful rickshaw on a busy market street">Rickshaw street</button>
    </div>
    <label class="lbl" for="negative">Leave out (optional)</label>
    <input id="negative" class="ad-input" type="text" maxlength="400" placeholder="For example: text, blurry, extra fingers">
    <span class="lbl">Style</span>
    <div class="styles" id="styles" role="group" aria-label="Style"></div>
    <span class="lbl">Shape</span>
    <div class="aspects" id="aspects" role="group" aria-label="Shape"></div>
    <span class="lbl">How many</span>
    <div class="seg" id="count" role="group" aria-label="How many pictures"></div>
    <button class="btn primary go" id="generate">Generate</button>
    <p class="fine">Tip: Ctrl+Enter generates. Pictures you make are kept in this browser only.</p>
  </section>
  <section class="out" aria-label="Results">
    <div id="soon" hidden></div>
    <p class="tip">Want a design right now? Start from <a href="/design/studio/">Studio templates</a>, sketch it in <a href="/design/draw/">Draw</a>, or touch up a photo in the <a href="/design/photo/">photo editor</a>.</p>
    <div id="results"></div>
    <h2 id="galleryHead" hidden>Your pictures</h2>
    <div class="gallery" id="gallery"></div>
  </section>
</main>
<div class="ad-toast" id="toast" hidden role="status"></div>
</body>
</html>
